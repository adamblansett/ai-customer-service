# Default values for ai-customer-service chart.

global:
  environment: production

api:
  replicaCount: 2
  image:
    repository: ghcr.io/adamblansett/ai-customer-service-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3001
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75

web:
  replicaCount: 2
  image:
    repository: ghcr.io/adamblansett/ai-customer-service-web
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: false

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "ai-customer-service-api"
  hosts:
    - host: contact-center.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: api
        - path: /
          pathType: Prefix
          service: web
  tls:
    - secretName: ai-customer-service-tls
      hosts:
        - contact-center.example.com

env:
  NODE_ENV: production
  PORT: "3001"
  CORS_ORIGIN: "https://contact-center.example.com"
  LOG_LEVEL: "info"

secrets:
  # Base64-encoded in Kubernetes Secret
  databaseUrl: "postgresql://postgres:postgres_secure_pw@postgres.db.svc.cluster.local:5432/customer_service?sslmode=disable"
  encryptionMasterKey: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  jwtSecret: "change_this_to_a_secure_jwt_signing_secret_in_production"
  redisUrl: "redis://redis.cache.svc.cluster.local:6379"
