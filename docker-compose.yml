services:
  # -----------------------------------------------------------------
  # 1. PostgreSQL Database
  # -----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: customer_service_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ai_customer_service}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_customer_service}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contact-center-net
    # Security: Database is NOT exposed to public internet by default
    expose:
      - "5432"

  # -----------------------------------------------------------------
  # 2. Backend API & Telephony Inbound Service
  # -----------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: customer_service_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_dev_password}@postgres:5432/${POSTGRES_DB:-ai_customer_service}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-default-change-me-master-key-32bytes-long!}
      JWT_SECRET: ${JWT_SECRET:-default-change-me-jwt-secret-for-production!}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - contact-center-net

  # -----------------------------------------------------------------
  # 3. Next.js Administration & Agent Console
  # -----------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: customer_service_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - contact-center-net

volumes:
  postgres_data:
    driver: local

networks:
  contact-center-net:
    driver: bridge
